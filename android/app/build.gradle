plugins {
    id "com.android.application"
}

// The app shares the site's version: <meta name="app-version" content="X.Y.Z"> in index.html.
// Play needs a growing integer too, so 1.4.4 becomes 10404.
def siteVersion = (file("../../index.html").text =~ /<meta name="app-version" content="(\d+)\.(\d+)\.(\d+)">/)
if (!siteVersion.find()) throw new GradleException("index.html has no app-version meta tag")
def (major, minor, patch) = (1..3).collect { siteVersion.group(it) as int }

// Signing settings live outside the repo. Override the path with BOMS_SIGNING_PROPERTIES.
def signingFile = file(System.getenv("BOMS_SIGNING_PROPERTIES")
        ?: "${System.getenv("USERPROFILE") ?: System.getProperty("user.home")}/.android-keys/boms-upload.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace = "eu.playboms.app"
    compileSdk = 36

    defaultConfig {
        applicationId = "eu.playboms.app"
        minSdk = 24
        targetSdk = 36
        versionCode = major * 10000 + minor * 100 + patch
        versionName = "${major}.${minor}.${patch}"
    }

    signingConfigs {
        if (signing.storeFile) {
            upload {
                storeFile = file(signing.storeFile)
                storePassword = signing.storePassword
                keyAlias = signing.keyAlias
                keyPassword = signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            if (signing.storeFile) signingConfig = signingConfigs.upload
        }
    }
}

dependencies {
    implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
}
